# Logstash — métriques d'exécution du pipeline SciPulse
# Chaque tâche (Airflow / Spark) écrit un événement JSON par ligne dans
# logs/pipeline/metrics.jsonl. Logstash les suit en continu (tail) et les
# indexe dans scipulse-pipeline-metrics, qui alimente le dashboard de monitoring.
input {
  file {
    path => "/usr/share/logstash/ingest/*.jsonl"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_metrics"
    codec => "json"
    mode => "tail"
  }
}

filter {
  date {
    match => ["event_time", "ISO8601"]
    target => "@timestamp"
  }
  mutate {
    remove_field => ["log", "host", "event", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "scipulse-pipeline-metrics"
    document_id => "%{event_id}"
    action => "index"
  }
}
